<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101719">
  <meta name="description" content="Personal barcode scanner with PDF sharing.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>AssetScan</title>
</head>
<body>
  <main class="app-shell">
    <header><h1>AssetScan</h1><span class="version">v14</span></header>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button id="tab-camera" class="tab" type="button" role="tab" aria-selected="true" aria-controls="panel-camera"><span aria-hidden="true">◉</span> Camera</button>
      <button id="tab-list" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-list" tabindex="-1"><span aria-hidden="true">☰</span> List <span id="tab-list-count" class="tab-count">0</span></button>
    </nav>
    <div id="scan-status" class="status" role="status" aria-live="polite">Ready.</div>
    <div id="panels" class="panels">
    <section id="panel-camera" class="card" role="tabpanel" aria-labelledby="tab-camera">
      <div class="camera-viewport" id="camera-viewport">
        <video id="camera-video" autoplay muted playsinline aria-label="Rear camera live view"></video>
        <span class="camera-idle">Camera off</span>
        <div class="viewfinder" id="viewfinder" aria-hidden="true"></div>
        <div class="focus-ring" id="focus-ring" aria-hidden="true"></div>
        <div class="debug-readout" id="debug-readout" hidden></div>
        <select id="lens-select" class="lens" aria-label="Camera lens" title="Camera lens" hidden><option value="">Auto</option></select>
      </div>
      <div class="camera-controls">
        <button id="scan-toggle" class="btn primary" type="button"><span id="scan-button-icon" aria-hidden="true">▷</span><span id="scan-button-label">Start camera</span></button>
        <button id="torch-toggle" class="btn" type="button" title="Flashlight unavailable until camera starts" aria-pressed="false" disabled>Flash</button>
        <button id="sound-toggle" class="btn sound" type="button" title="Mute scan melody" aria-label="Scan sound" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></button>
      </div>
    </section>
    <section id="panel-list" class="card batch" role="tabpanel" aria-labelledby="tab-list" hidden>
      <div class="batch-heading"><h2 id="batch-heading">Scanned <span id="batch-heading-count">(0)</span></h2><button id="clear-button" class="btn text danger" type="button" disabled>Clear list</button></div>
      <div class="batch-options"><label><input id="skip-duplicates" type="checkbox" checked> Skip duplicates</label><button id="undo-button" class="btn text" type="button" disabled>Undo last</button></div>
      <p id="empty-batch" class="empty-batch">No scans yet.</p>
      <ol id="batch-list" class="batch-list" hidden></ol>
      <div class="share-bar"><button id="share-pdf-button" type="button" class="btn primary share" disabled><strong>Share</strong><small>PDF · codes + photos</small></button></div>
    </section>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./media.js"></script>
  <script src="./scanner.js"></script>
  <script src="./app.js"></script>
</body>
</html>
